name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Instalar cargo-deb e cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Gerar .deb
        run: cargo deb

      - name: Gerar .rpm
        run: |
          strip -s target/release/openvpn-gui
          cargo generate-rpm

      - name: Gerar .zip
        run: zip -j openvpn-gui-linux-x86_64.zip target/release/openvpn-gui

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            openvpn-gui-linux-x86_64.zip
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}