[package]
name = "openvpn-gui"
version = "0.2.0"
edition = "2024"
authors = ["m1theusr"]
description = "OpenVPN GUI client for GNOME"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = "0.20"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"

[build-dependencies]
glib-build-tools = "0.20"

# ─── RPM ───────────────────────────────────────────────
[package.metadata.generate-rpm]
name = "openvpn-gui"
version = "0.2.0"
license = "GPL-3.0"
summary = "Cliente OpenVPN gráfico para GNOME"
description = "Cliente OpenVPN moderno com GTK4 e Libadwaita para gerenciar conexões VPN no Linux."

# ⚠️ requires DEVE vir ANTES dos [[assets]]
[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.12"
libadwaita = ">= 1.4"
openvpn = "*"

[[package.metadata.generate-rpm.assets]]
source = "target/release/openvpn-gui"
dest = "/usr/bin/openvpn-gui"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "data/resources/openvpn-logo.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/openvpn-gui.svg"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "data/com.github.m1theusr.OpenVPNGUI.desktop"
dest = "/usr/share/applications/com.github.m1theusr.OpenVPNGUI.desktop"
mode = "0644"

# ─── DEB ───────────────────────────────────────────────
[package.metadata.deb]
maintainer = "m1theusr <m1theusr@github.com>"
copyright = "2026, m1theusr"
section = "net"
priority = "optional"
depends = "libgtk-4-1 (>= 4.12), libadwaita-1-0 (>= 1.4), openvpn"
extended-description = "Cliente OpenVPN gráfico moderno com GTK4 e Libadwaita para gerenciar conexões VPN no Linux."
assets = [
    ["target/release/openvpn-gui", "usr/bin/", "755"],
    ["data/resources/openvpn-logo.svg", "usr/share/icons/hicolor/scalable/apps/openvpn-gui.svg", "644"],
    ["data/com.github.m1theusr.OpenVPNGUI.desktop", "usr/share/applications/com.github.m1theusr.OpenVPNGUI.desktop", "644"],
    ["README.md", "usr/share/doc/openvpn-gui/README.md", "644"],
]