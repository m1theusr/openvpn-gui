[package]
name = "openvpn-gui"
version = "0.1.0"
edition = "2021"
authors = ["m1theusr"]
description = "OpenVPN GUI client for GNOME"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = "0.20"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"

[build-dependencies]
glib-build-tools = "0.20"
